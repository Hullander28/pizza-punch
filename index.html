 const e={type:t,x,y,z:0,vz:0,vx:0,hurt:0,ko:0,sleep:false,cd:60+rnd()*60,face:L?1:-1,anim:rnd()*9,slow:0,talk:'',talkT:0,grab:0,col:['#6a4','#a6d','#d84','#4ad','#d4a'][Math.floor(rnd()*5)],hair:['#5a3a1a','#222','#a83','#d9c27a'][Math.floor(rnd()*4)],dread:rnd()<.4};

addEventListener('keydown',e=>{ac();startMusic();const k=e.key.toLowerCase();K[k]=1;if(['arrowup','arrowdown',' '].includes(k))e.preventDefault();

function cp(t){const r=C.getBoundingClientRect();return{x:(t.clientX-r.left)/r.width*W,y:(t.clientY-r.top)/r.height*H}}
let UI=[];function uiTap(p){for(const b of UI)if(p.x>=b.x&&p.x<=b.x+b.w&&p.y>=b.y&&p.y<=b.y+b.h){b.f();beep(500,.04);return true;}return false;}
function tch(e){e.preventDefault();ac();startMusic();
 if(state!=='play'){if(e.type==='touchstart')uiTap(cp(e.changedTouches[0]));return;}
 if(e.type==='touchstart')for(const t of e.changedTouches){const p=cp(t);if(p.y<50&&p.x<75){useSnack();}if(p.y>18&&p.y<40&&p.x>W-140&&p.x<W-30)swap();}
